[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vae-dsaa"
version = "4.0.0"
description = "Stratified VAE with Dual-Signal Anomaly Attribution — behavioural fraud detection for DeepSentinel (R26-IT-121)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Wijesinghe L.P.D.B.", email = "it22109194@my.sliit.lk" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# pydantic is not optional to the API: src/vae_dsaa/api/schemas.py imports it
# at module scope, so `pip install .[api]` without it cannot serve.
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.6"]
# Cluster discovery only. Not needed to serve — the API reads typologies that
# were assigned during training.
typology = ["hdbscan>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
