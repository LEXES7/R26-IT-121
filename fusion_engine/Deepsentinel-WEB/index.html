<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSentinel — Explainable fraud detection</title>
    <meta name="description" content="Four detectors read every transaction at once — the payment graph around it, how it fits its type, and the sequence it arrived in — and fuse one verdict with the evidence behind it." />
    <meta name="theme-color" content="#0e1113" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f8f9" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DeepSentinel — Explainable fraud detection" />
    <meta property="og:description" content="A multi-modal fraud detector that shows its reasoning: the accounts involved, the behaviour that looked wrong, and the transaction that came before." />
    <meta name="twitter:card" content="summary_large_image" />
      <script>
      /* Applied before first paint: reading the preference in React would
         flash the wrong theme for a frame on every load. */
      (function () {
        try {
          var t = localStorage.getItem('ds.theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
